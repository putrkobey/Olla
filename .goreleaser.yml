# Local verification of a release snapshot. Run on a host that has Go,
# Bun and make installed (the before.hooks run `make build-web`),
# then from the repo root:
#   $ goreleaser release --snapshot --clean
# The bare goreleaser/goreleaser container image lacks Go, Bun and make,
# so it cannot satisfy the hooks. Tagged releases are cut by the
# GitHub Actions workflow at .github/workflows/release.yml, which pins
# setup-bun before invoking goreleaser.

version: 2

project_name: olla

before:
  hooks:
    - go mod download
    # Build the dashboard SPA into the gitignored embed source before the Go
    # build compiles it in. Release binaries must always ship the current SPA.
    - make build-web
    # Create empty directories for the package
    - mkdir -p logs tmp data build
    - touch data/.gitkeep
    - touch logs/.gitkeep
    - touch tmp/.gitkeep
    - bash ./scripts/generate-container-config.sh
    # Stage the docker-flavoured config under build/ (gitignored, ephemeral) -
    # it used to overwrite the tracked root config.yaml here, which is now the
    # canonical default and must not be clobbered by a release build. The
    # Dockerfile lands it at /app/config/config.yaml, the first path the config
    # loader searches.
    - cp config/docker.yaml build/docker-config.yaml

release:
  name_template: "Olla {{ .Tag }}"
  draft: false
  prerelease: auto
  make_latest: true
  header: |
    ## What's in this release

    Olla is a high-performance proxy and load balancer for LLM infrastructure.

    ### Quick Start
    ```bash
    # Docker
    docker pull ghcr.io/putrkobey/Olla:{{ .Tag }}

    # Binary (see assets below)
    ./olla --config config.yaml
    ```
  footer: |
    ---
    **Documentation:** [thushan.github.io/olla](https://thushan.github.io/olla/) | **Issues:** [github.com/putrkobey/Olla/issues](https://github.com/putrkobey/Olla/issues)

snapshot:
  name_template: '{{ incpatch .Version }}-{{.ShortCommit}}'

builds:
  - id: default
    env:
      - CGO_ENABLED=0
    goarch:
      - amd64
      - arm64
    goamd64:
      # https://github.com/golang/go/wiki/MinimumRequirements#amd64
      - v1
    goos:
      - darwin
      - freebsd
      - linux
      - windows
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X "github.com/putrkobey/Olla/internal/version.Version=v{{.Version}}"
      - -X "github.com/putrkobey/Olla/internal/version.Commit={{.Commit}}"
      - -X "github.com/putrkobey/Olla/internal/version.Date={{.CommitDate}}"
      - -X "github.com/putrkobey/Olla/internal/version.User=goreleaser"
#    asmflags:
#      - all=-trimpath={{ dir (default "." .Env.PWD) }}
#    gcflags:
#      - all=-trimpath={{ dir (default "." .Env.PWD) }}


dockers:
  - image_templates:
      - "ghcr.io/putrkobey/Olla:latest-amd64"
      - "ghcr.io/putrkobey/Olla:{{ .Tag }}-amd64"
      - "ghcr.io/putrkobey/Olla:v{{ .Major }}-amd64"
      - "ghcr.io/putrkobey/Olla:v{{ .Major }}.{{ .Minor }}-amd64"
    dockerfile: Dockerfile
    goos: linux
    goarch: amd64
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source={{.GitURL}}"
      - "--label=org.opencontainers.image.description=High-performance LLM front-end load balancer and proxy"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"
    # The image_templates above are unconditional, so without this an RC tag
    # would republish :latest, :v0 and :v0.0 to every user. "auto" skips the
    # push for prereleases and snapshots only; a real tag publishes as normal.
    skip_push: auto
    extra_files:
      # Exactly what the Dockerfile COPYs, alongside the binary goreleaser adds.
      # Docker-flavoured config is staged under build/ by the before-hook above
      # rather than overwriting the tracked root config.yaml.
      - build/docker-config.yaml
      - config/models.yaml
      - config/profiles/
  - image_templates:
      - "ghcr.io/putrkobey/Olla:latest-arm64"
      - "ghcr.io/putrkobey/Olla:{{ .Tag }}-arm64"
      - "ghcr.io/putrkobey/Olla:v{{ .Major }}-arm64"
      - "ghcr.io/putrkobey/Olla:v{{ .Major }}.{{ .Minor }}-arm64"
    dockerfile: Dockerfile
    goos: linux
    goarch: arm64
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source={{.GitURL}}"
      - "--label=org.opencontainers.image.description=High-performance LLM front-end load balancer and proxy"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"
    # The image_templates above are unconditional, so without this an RC tag
    # would republish :latest, :v0 and :v0.0 to every user. "auto" skips the
    # push for prereleases and snapshots only; a real tag publishes as normal.
    skip_push: auto
    extra_files:
      # Exactly what the Dockerfile COPYs, alongside the binary goreleaser adds.
      # Docker-flavoured config is staged under build/ by the before-hook above
      # rather than overwriting the tracked root config.yaml.
      - build/docker-config.yaml
      - config/models.yaml
      - config/profiles/

docker_manifests:
  - skip_push: auto
    name_template: ghcr.io/putrkobey/Olla:latest
    image_templates:
        - "ghcr.io/putrkobey/Olla:latest-amd64"
        - "ghcr.io/putrkobey/Olla:latest-arm64"
  - skip_push: auto
