name: vuln
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
