# Ollama inference platform profile
name: ollama
version: "1.0"
display_name: "Ollama"
description: "Local Ollama instance for running GGUF models"

# Routing configuration
routing:
  prefixes:
    - ollama

# API compatibility
api:
  openai_compatible: true

  # Anthropic Messages API support (v0.14.0+)
  # UNSUPPORTED:
  #           - /v1/messages/count_tokens
  #             [11-01-2026]: https://docs.ollama.com/api/anthropic-compatibility#not-supported
  anthropic_support:
    enabled: true
    messages_path: /v1/messages
    token_count: false
    min_version: "0.14.0"
    limitations:
      - token_counting_404

  paths:
    - /                    # 0: health check
    - /api/generate        # 1: text completion
    - /api/chat            # 2: chat completion  
    - /api/embeddings      # 3: generate embeddings
    - /api/tags            # 4: list local models
    - /api/show            # 5: show model info
    - /v1/models           # 6: OpenAI compat
    - /v1/chat/completions # 7: OpenAI compat
    - /v1/completions      # 8: OpenAI compat
    - /v1/embeddings       # 9: OpenAI compat
    - /api/embed           # 10: generate embeddings (supersedes /api/embeddings)
    - /api/ps              # 11: models currently loaded
    - /api/version         # 12: server version
    # /v1/responses needs Ollama 0.13.3+, /v1/messages 0.14.0+; older releases 404.
    - /v1/responses        # 13: OpenAI Responses API
    - /v1/messages         # 14: Anthropic Messages API
    # Deliberately absent: /api/pull, /api/push, /api/create, /api/copy,
    # and /api/delete mutate one backend's model store, so
    # Olla answers them with 501 instead of applying them to an arbitrary
    # instance (see registerProviderPrefixRoutes). /api/me, /api/signout and
    # /api/user/keys act on an Ollama account, not on inference.
  model_discovery_path: /api/tags
  health_check_path: /

# Platform characteristics
characteristics:
  timeout: 5m  # Ollama can be slow for large models
  max_concurrent_requests: 10
  default_priority: 100
  streaming_support: true
  auth:
    required: false
    types:
      - bearer   # used by Ollama Cloud and protected remote instances
  
# Detection hints for auto-discovery
detection:
  user_agent_patterns:
    - "ollama/"
  headers:
    - "X-Ollama-Version"
  path_indicators:
    - "/"
    - "/api/tags"
  default_ports:
    - 11434

# Model handling
models:
  name_format: "{{.Name}}"  # e.g., "llama3:latest"
  capability_patterns:
    vision:
      - "*llava*"
      - "*vision*"
      - "*bakllava*"
    embeddings:
      - "*embed*"
      - "nomic-embed-text"
      - "mxbai-embed-large"
    code:
      - "*code*"
      - "codellama*"
      - "deepseek-coder*"
      - "qwen*coder*"
  # Context window detection patterns
  context_patterns:
    - pattern: "*-32k*"
      context: 32768
    - pattern: "*-16k*"
      context: 16384
    - pattern: "*-8k*"
      context: 8192
    - pattern: "*:32k*"
      context: 32768
    - pattern: "*:16k*"
      context: 16384
    - pattern: "*:8k*"
      context: 8192
    - pattern: "llama3*"
      context: 8192
    - pattern: "llama-3*"
      context: 8192
      
# Request/response handling
request:
  model_field_paths:
    - "model"
  response_format: "ollama"
  parsing_rules:
    chat_completions_path: "/api/chat"
    completions_path: "/api/generate"
    generate_path: "/api/generate"
    model_field_name: "model"
    supports_streaming: true

# Path indices for specific functions
path_indices:
  health: 0
  completions: 1
  chat_completions: 2
  embeddings: 3
  models: 4

# Resource management
resources:
  # Model size patterns with memory requirements
  model_sizes:
    - patterns: ["70b", "72b"]
      min_memory_gb: 40
      recommended_memory_gb: 48
