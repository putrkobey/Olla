# Ollama inference platform profile
name: ollama
version: "1.0"
display_name: "Ollama"
description: "Local Ollama instance for running GGUF models"

# Routing configuration
routing:
  prefixes:
    - ollama

# API compatibility
api:
  openai_compatible: true

  # Anthropic Messages API support (v0.14.0+)
  # UNSUPPORTED:
  #           - /v1/messages/count_tokens
  #             [11-01-2026]: https://docs.ollama.com/api/anthropic-compatibility#not-supported
  anthropic_support:
    enabled: true
    messages_path: /v1/messages
    token_count: false
    min_version: "0.14.0"
    limitations:
      - token_counting_404

  paths:
    - /                    # 0: health check
    - /api/generate        # 1: text completion
    - /api/chat            # 2: chat completion  
    - /api/embeddings      # 3: generate embeddings
    - /api/tags            # 4: list local models
    - /api/show            # 5: show model info
    - /v1/models           # 6: OpenAI compat
    - /v1/chat/completions # 7: OpenAI compat
    - /v1/completions      # 8: OpenAI compat
    - /v1/embeddings       # 9: OpenAI compat
    - /api/embed           # 10: generate embeddings (supersedes /api/embeddings)
    - /api/ps              # 11: models currently loaded
    - /api/version         # 12: server version
    # /v1/responses needs Ollama 0.13.3+, /v1/messages 0.14.0+; older releases 404.
    - /v1/responses        # 13: OpenAI Responses API
    - /v1/messages         # 14: Anthropic Messages API
    # Deliberately absent: /api/pull, /api/push, /api/create, /api/copy,
    # and /api/delete mutate one backend's model store, so
