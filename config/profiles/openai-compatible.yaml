# OpenAI-compatible inference platform profile
name: openai-compatible
version: "1.0"
display_name: "OpenAI Compatible"
description: "OpenAI-compatible API"

# Routing configuration
routing:
  prefixes:
    # We added an alias for openai in this profile in v0.0.28+
    - openai
    - openai-compatible

# API compatibility
api:
  openai_compatible: true

  # Anthropic Messages API support
  # Most OpenAI-compatible backends (LiteLLM, generic proxies) do not natively serve
  # /v1/messages, so passthrough is disabled by default to avoid 404s. Enable this
  # per backend profile (e.g. vllm.yaml, lmstudio.yaml) when the server supports it.
  anthropic_support:
    enabled: false
    messages_path: /v1/messages
    token_count: false

  paths:
    - /v1/models          # 0: health check & models
    - /v1/chat/completions # 1: chat completions
    - /v1/completions     # 2: completions
    - /v1/embeddings      # 3: embeddings
    # This profile is the catch-all for servers Olla has no profile for (a remote vLLM or
    # SGLang typed "openai"), so it declares the paths those servers commonly serve beyond
    # the OpenAI API. Left undeclared, stage 1 would drop these hosts from a path whenever
    # any other profile declares it. Declaring a path only keeps the host a candidate:
    # a request that names a model is still routed by that model, and this is not
    # Anthropic passthrough (anthropic_support stays disabled). Only paths that Ollama and
    # LM Studio also serve belong here: this profile's paths implicitly admit those two as
    # candidates, so /v1/messages/count_tokens and /v1/rerank (which they 404) are left out.
    - /v1/responses      # 4: OpenAI Responses API
    - /v1/messages       # 5: Anthropic Messages API
  model_discovery_path: /v1/models
  health_check_path: /v1/models

# Platform characteristics
characteristics:
  timeout: 2m
  max_concurrent_requests: 20
  default_priority: 50
  streaming_support: true
  auth:
    required: false
    types:
      - bearer   # standard Authorization: Bearer for most OpenAI-compatible APIs
      - api_key  # some backends use a custom header (set header: in auth config)

# Detection hints for auto-discovery
detection:
  path_indicators:
    - "/v1/models"

