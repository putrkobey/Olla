# llama.cpp inference server profile
name: llamacpp
home: "https://github.com/ggerganov/llama.cpp"
version: "1.0"
display_name: "llama.cpp"
description: "llama.cpp high-performance C++ inference server for GGUF models"

# Routing configuration
routing:
  prefixes:
    - llamacpp
    # Enable other aliases if needed
    #- llama-cpp
    #- llama_cpp

# API compatibility
api:
  openai_compatible: true

  # Anthropic Messages API support (b4847+)
  # llama.cpp supports token counting via /v1/messages/count_tokens (dmr and vllm-mlx also support this).
  # This enables accurate prompt token estimation without making actual inference requests
  anthropic_support:
    enabled: true
    messages_path: /v1/messages
    token_count: true
    min_version: "b4847"

  paths:
    # Indices below are the real array positions (the disabled health/props/
    # slots/metrics entries further down are commented out, so they do not
    # occupy a slot). path_indices further down must stay in step with these.
    # Model management (OpenAI-compatible)
    - /v1/models           # 0: list models (typically returns single model)

    # Text generation endpoints
    - /completion          # 1: native completion endpoint (llama.cpp format)
    - /v1/completions      # 2: OpenAI-compatible completions
    - /v1/chat/completions # 3: OpenAI-compatible chat

    # Embeddings
    - /embedding           # 4: native embedding endpoint
    - /v1/embeddings       # 5: OpenAI-compatible embeddings

    # Tokenisation (llama.cpp-specific)
    - /tokenize            # 6: encode text to tokens
    - /detokenize          # 7: decode tokens to text

    # Code completion (llama.cpp-specific)
    - /infill              # 8: code infill/completion (FIM support)
    # Newer paths: /v1/messages needs build b7187+, /v1/responses b7793+; older builds 404.
    # /v1/rerank only answers when the server was started with --reranking.
    - /v1/responses # 9: OpenAI Responses API
    - /v1/messages # 10: Anthropic Messages API
    - /v1/messages/count_tokens # 11: Anthropic token count
    - /v1/rerank # 12: reranking API

    # Health and system endpoints (disabled)
    # Until Olla aggregates these properly, we disable them as the
    # load balancer will decide endpoint is used instead.
    # We will enable this in the future when Olla supports it.
    #- /health              # 0: health check
    #- /props               # 1: server properties (model info, context size, etc.)
    #- /slots               # 2: slot status (concurrent request tracking)
    #- /metrics             # 3: Prometheus metrics

  model_discovery_path: /v1/models
  health_check_path: /health
  metrics_path: /metrics
  props_path: /props           # llama.cpp-specific: runtime configuration
  slots_path: /slots           # llama.cpp-specific: concurrency monitoring

# Platform characteristics
characteristics:
  timeout: 5m                  # Similar to Ollama for large models
  max_concurrent_requests: 4   # Conservative for single-model architecture
  default_priority: 95         # High priority for direct GGUF inference
  streaming_support: true
  single_model_server: true    # important: One model per instance
  auth:
    required: false
    types:
      - bearer   # enabled via --api-key flag

# Detection hints for auto-discovery
detection:
  path_indicators:
    - "/v1/models"
    - "/health"
    - "/slots"
    - "/props"
  default_ports:
    - 8080
    - 8001
  response_headers:
    - "Server: llama.cpp"
  server_signatures:
    - "llama.cpp"

# Request/response handling
request:
  model_field_paths:
    - "model"
  response_format: "llamacpp"
  parsing_rules:
    chat_completions_path: "/v1/chat/completions"
    completions_path: "/v1/completions"
    native_completion_path: "/completion"
    native_embedding_path: "/embedding"
    model_field_name: "model"
    supports_streaming: true

# Path indices for specific functions, matching the enabled entries in
# api.paths above. health/props/slots/metrics/native_completion/
# native_embedding/tokenize/detokenize/infill are documentation only - Olla's
# PathIndices struct only reads health, models, completions, chat_completions
# and embeddings. health is -1: /health is commented out of api.paths above,
# so there is no valid index for it; health checks use api.health_check_path.
path_indices:
  health: -1
  props: -1
  slots: -1
  metrics: -1
  models: 0
  native_completion: 1
