## Olla Integration Test Configuration
## Points at mock backends on localhost.

server:
  host: "127.0.0.1"
  port: 40114
  read_timeout: 10s
  write_timeout: 0s
  shutdown_timeout: 5s
  request_logging: true
  request_limits:
    max_body_size: 10485760
    max_header_size: 524288
  rate_limits:
    global_requests_per_minute: 1000
    per_ip_requests_per_minute: 200
    health_requests_per_minute: 1000
    burst_size: 50
    cleanup_interval: 5m
    trust_proxy_headers: false
    trusted_proxy_cidrs: ["127.0.0.0/8"]

proxy:
  engine: "olla"
  profile: "auto"
  load_balancer: "priority"
  # stream_buffer_size: 8192  # Unset: the engine default applies (Olla 64KiB, Sherpa 8KiB)
  connection_timeout: 10s
  response_timeout: 30s
  read_timeout: 30s

discovery:
  type: "static"
  refresh_interval: 10s
  static:
    endpoints:
      - url: "http://127.0.0.1:18901"
        name: "mock-vllm"
        type: "vllm"
        priority: 100
        model_url: "/v1/models"
        health_check_url: "/health"
