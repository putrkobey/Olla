site_name: Olla
site_description: High-performance proxy and load balancer for LLM infrastructure
site_author: Thushan Fernando
site_url: https://thushan.github.io/olla/

repo_name: putrkobey/Olla
repo_url: https://github.com/putrkobey/Olla
edit_uri: edit/main/docs/content/
docs_dir: content

theme:
  name: material
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: light-blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: light-blue
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.select
    - content.action.edit
    - content.action.view

  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

extra_css:
  - stylesheets/extra.css
  - stylesheets/nightowl.css

copyright: >
  Olla is an open-source project by <a href="https://tensorfoundry.io" target="_blank" rel="noopener">TensorFoundry</a>

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://tensorfoundry.io
      name: TensorFoundry
    - icon: fontawesome/brands/github
      link: https://github.com/putrkobey/Olla
      name: Olla on GitHub

markdown_extensions:
  - abbr
  - admonition
  - attr_list
