site_name: Olla
site_description: High-performance proxy and load balancer for LLM infrastructure
site_author: Thushan Fernando
site_url: https://thushan.github.io/olla/

repo_name: putrkobey/Olla
repo_url: https://github.com/putrkobey/Olla
edit_uri: edit/main/docs/content/
docs_dir: content

theme:
  name: material
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: light-blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: light-blue
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.select
    - content.action.edit
    - content.action.view

  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

extra_css:
  - stylesheets/extra.css
  - stylesheets/nightowl.css

copyright: >
  Olla is an open-source project by <a href="https://tensorfoundry.io" target="_blank" rel="noopener">TensorFoundry</a>

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://tensorfoundry.io
      name: TensorFoundry
    - icon: fontawesome/brands/github
      link: https://github.com/putrkobey/Olla
      name: Olla on GitHub

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: thushan
      repo: olla
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - minify:
      minify_html: true

nav:
  - Home: 
      - Overview: index.md
      - Demo: demo.md
      - FAQ: faq.md
      - Notes: notes/overview.md
      - Usage: usage.md
      - Release Notes: about/release-notes.md
      - About: about.md
      - Compare:
        - Overview: compare/overview.md
        - Patterns: compare/integration-patterns.md
        - vs GpuStack: compare/gpustack.md
        - vs LiteLLM: compare/litellm.md
        - vs LocalAI: compare/localai.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - Configuration: configuration/overview.md
  - Concepts:
      - Overview: concepts/overview.md
      - Load Balancing: concepts/load-balancing.md
      - Sticky Sessions: concepts/sticky-sessions.md
      - Model Routing: concepts/model-routing.md
      - Model Aliases: concepts/model-aliases.md
      - Model Unification: concepts/model-unification.md
      - Health Checking: concepts/health-checking.md
      - API Translation: concepts/api-translation.md
      - Proxy Engines:
          - Overview: concepts/proxy-engines.md
