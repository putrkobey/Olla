# Olla Configuration for Open WebUI Integration
# This config connects to external Ollama instances and provides a unified interface for Open WebUI.

server:
  host: "0.0.0.0"
  port: 40114
  read_timeout: 30s
  read_header_timeout: 10s
  write_timeout: 0s # for LLMs streaming, leave this as 0s
  shutdown_timeout: 10s
  request_logging: true
  request_limits:
    max_body_size: 52428800  # 50MB
    max_header_size: 524288  # 512KB
  rate_limits:
    global_requests_per_minute: 1000
    per_ip_requests_per_minute: 100
    health_requests_per_minute: 1000
    burst_size: 50
    cleanup_interval: 5m
    trust_proxy_headers: false
    trusted_proxy_cidrs: [
      "127.0.0.0/8",
